apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: queuescale-rabbitmq-auth
  namespace: queuescale
spec:
  secretTargetRef:
    - parameter: host
      name: queuescale-rabbitmq-secret
      key: host
    - parameter: username
      name: queuescale-rabbitmq-secret
      key: username
    - parameter: password
      name: queuescale-rabbitmq-secret
      key: password