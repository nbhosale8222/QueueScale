apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: queuescale-worker-scaler
  namespace: queuescale
spec:
  scaleTargetRef:
    name: queuescale-worker

  pollingInterval: 5
  cooldownPeriod: 30

  minReplicaCount: 0
  maxReplicaCount: 5

  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: registration_queue
        mode: QueueLength
        value: "5"
        activationValue: "0"
      authenticationRef:
        name: queuescale-rabbitmq-auth