apiVersion: apps/v1
kind: Deployment
metadata:
  name: queuescale-worker
  namespace: queuescale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queuescale-worker
  template:
    metadata:
      labels:
        app: queuescale-worker
    spec:
      containers:
        - name: worker
          image: queuescale-worker:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://queuescale:queuescale_dev@host.docker.internal:5435/queuescale"
            - name: RABBITMQ_HOST
              value: "host.docker.internal"
            - name: RABBITMQ_PORT
              value: "5673"
            - name: RABBITMQ_USER
              value: "queuescale"
            - name: RABBITMQ_PASSWORD
              value: "queuescale_dev"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi